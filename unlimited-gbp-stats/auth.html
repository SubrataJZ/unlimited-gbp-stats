<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Unlimited GBP Stats</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">

      <!-- Logo / Header -->
      <div class="auth-header">
        <div class="auth-logo">📊</div>
        <h1 class="auth-title">Unlimited GBP Stats</h1>
        <p class="auth-subtitle">Sign in to sync your data across devices</p>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" id="signupTab" onclick="switchTab('signup')">Create Account</button>
      </div>

      <!-- Error / Success banner -->
      <div id="authBanner" class="auth-banner hidden"></div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="input-row">
            <input type="password" id="loginPassword" placeholder="Your password" required autocomplete="current-password">
            <button type="button" class="toggle-pw" onclick="togglePw('loginPassword')">👁</button>
          </div>
        </div>
        <button type="submit" class="auth-btn" id="loginBtn">
          <span class="btn-text">Sign In</span>
          <span class="btn-loader hidden">⏳</span>
        </button>
        <div class="auth-divider"><span>or</span></div>
        <button type="button" class="google-btn" id="googleLoginBtn" onclick="handleGoogleSignIn()">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Continue with Google
        </button>
      </form>

      <!-- Signup Form -->
      <form id="signupForm" class="auth-form hidden" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label for="signupName">Your Name</label>
          <input type="text" id="signupName" placeholder="John Smith" autocomplete="name">
        </div>
        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <div class="input-row">
            <input type="password" id="signupPassword" placeholder="Min 6 characters" required autocomplete="new-password">
            <button type="button" class="toggle-pw" onclick="togglePw('signupPassword')">👁</button>
          </div>
        </div>
        <div class="form-group">
          <label for="signupConfirm">Confirm Password</label>
          <input type="password" id="signupConfirm" placeholder="Repeat password" required autocomplete="new-password">
        </div>
        <button type="submit" class="auth-btn" id="signupBtn">
          <span class="btn-text">Create Account</span>
          <span class="btn-loader hidden">⏳</span>
        </button>
        <div class="auth-divider"><span>or</span></div>
        <button type="button" class="google-btn" id="googleSignupBtn" onclick="handleGoogleSignIn()">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Continue with Google
        </button>
      </form>

      <!-- Footer -->
      <p class="auth-footer">
        Your data stays on your device and syncs privately to your account.
      </p>

    </div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
