<!doctype html>
<html lang="en" data-mode="{{MODE}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} — Unlimited GBP Stats</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-mode="{{MODE}}">
  <main class="card">
    <div class="brand">
      <div class="logo">📊</div>
      <h1>Unlimited GBP Stats</h1>
      <p id="brandSub">Sign in to your account</p>
    </div>

    <div id="banner" class="banner" hidden></div>

    <!-- Sign in -->
    <form data-form="login" hidden autocomplete="on">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" required autocomplete="current-password" placeholder="Your password">
      </div>
      <button type="submit" class="primary">Sign in</button>
    </form>

    <!-- Create account -->
    <form data-form="signup" hidden autocomplete="on">
      <div class="field">
        <label for="suName">Your name <span style="color:#4a5068">(optional)</span></label>
        <input type="text" id="suName" name="name" autocomplete="name" placeholder="Jane Doe">
      </div>
      <div class="field">
        <label for="suEmail">Email</label>
        <input type="email" id="suEmail" name="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="suPassword">Password</label>
        <input type="password" id="suPassword" name="password" required autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
      </div>
      <div class="field">
        <label for="suConfirm">Confirm password</label>
        <input type="password" id="suConfirm" name="confirm" required autocomplete="new-password" placeholder="Repeat password">
      </div>
      <button type="submit" class="primary">Create account</button>
    </form>

    <!-- Forgot password -->
    <form data-form="forgot" hidden autocomplete="on">
      <p style="font-size:13px;color:#8b92a5">Enter your email and we'll send a link to reset your password.</p>
      <div class="field">
        <label for="fpEmail">Email</label>
        <input type="email" id="fpEmail" name="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <button type="submit" class="primary">Send reset link</button>
    </form>

    <!-- Reset password -->
    <form data-form="reset" hidden autocomplete="on">
      <p style="font-size:13px;color:#8b92a5">Choose a new password for your account.</p>
      <div class="field">
        <label for="rpPassword">New password</label>
        <input type="password" id="rpPassword" name="password" required autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
      </div>
      <div class="field">
        <label for="rpConfirm">Confirm new password</label>
        <input type="password" id="rpConfirm" name="confirm" required autocomplete="new-password" placeholder="Repeat password">
      </div>
      <button type="submit" class="primary">Update password</button>
    </form>

    <!-- Success panel -->
    <div class="done" data-form="done" hidden>
      <div class="big">✅</div>
      <h2 id="doneTitle">Done</h2>
      <p id="doneBody"></p>
    </div>

    <nav class="nav" id="nav"></nav>
    <p class="foot">Your data stays on your device and syncs privately to your account.</p>
  </main>

  <script src="./app.js"></script>
</body>
</html>
