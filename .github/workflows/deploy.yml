name: Deploy to Production

on:
  workflow_run:
    workflows: ["Test Backend API"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Best-effort: every ssh below passes -o StrictHostKeyChecking=no, so a
          # missing known_hosts entry is harmless. Without `|| true` a failed or
          # empty keyscan kills this step under `bash -e` and skips the whole deploy.
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts || true

      - name: Pull latest code on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /home/zixify-app && git clean -fd && git reset --hard && git fetch origin && git checkout main && git reset --hard origin/main"

      - name: Rebuild Docker images
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /home/zixify-app && docker compose build"

      - name: Restart services
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /home/zixify-app && docker compose up -d"

      # Migrations run inside entrypoint.sh at container start, and it
      # deliberately keeps the server up when they fail so an outage is not
      # total. That tolerance means a failed migration is otherwise INVISIBLE:
      # the deploy goes green, the app serves traffic, and the schema quietly
      # stops tracking the code. This step is what makes it visible — it always
      # prints the migration output, and fails the deploy on the failure banner.
      - name: Verify database migrations
        run: |
          # NEVER print raw container logs. The backend's startup banner is
          # read by whoever can read this workflow run, and anything the
          # container chooses to echo would land in it. Only the slice between
          # the "Step 2" banner and the end is printed, and only after it has
          # actually appeared.
          LAST=""
          for attempt in $(seq 1 12); do
            LOGS=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "cd /home/zixify-app && docker compose logs --tail=400 backend" 2>/dev/null)

            # Only the most recent boot matters. Everything from the last
            # "Step 2" banner onward is this container's startup; earlier text
            # may belong to a previous run whose outcome says nothing about
            # this deploy.
            LAST=$(echo "$LOGS" | awk '
              /Step 2: Applying database migrations/ { found = 1; buf = "" }
              found { buf = buf $0 ORS }
              END { printf "%s", buf }')

            # Migrations take a few seconds; the banner appears before the
            # result does, so wait for a verdict rather than the banner alone.
            if echo "$LAST" | grep -qE "Migrations applied|MIGRATIONS FAILED"; then
              break
            fi
            echo "waiting for migration output (attempt $attempt)…"
            sleep 5
          done

          echo "── migration output from the most recent backend start ──"
          if [ -z "$LAST" ]; then
            echo "(no migration banner found — see the note below)"
          else
            echo "$LAST" | head -40
          fi
          echo "────────────────────────────────────────────────────────"

          if echo "$LAST" | grep -q "MIGRATIONS FAILED"; then
            echo "::error::Database migrations failed on the VPS. The schema may not match this build — investigate before trusting any write path."
            exit 1
          fi

          if echo "$LAST" | grep -q "Migrations applied"; then
            echo "✅ Migrations applied cleanly"
          else
            # Not fatal: `docker compose up -d` is a no-op when nothing changed,
            # so an unchanged container simply never re-ran its entrypoint.
            echo "::warning::No migration result line found — the backend container may not have restarted during this deploy."
          fi

      - name: Verify backend health
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sleep 10 && curl -sf http://localhost:3001/health && echo 'Backend healthy!'"

      - name: Deployment success
        if: success()
        run: echo "✅ Successfully deployed to https://zixify.zixai.in"

      - name: Deployment failed
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /home/zixify-app && docker compose logs --tail=50 backend" || true
          echo "❌ Deployment failed — check logs above"
