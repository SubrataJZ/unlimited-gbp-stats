name: Deploy to Production

on:
  workflow_run:
    workflows: ["Test Backend API"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull latest code on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 65002 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /home/zixify-app && git clean -fd && git reset --hard && git fetch origin && git checkout main && git reset --hard origin/main"

      - name: Rebuild Docker images
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 65002 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /home/zixify-app && docker compose build"

      - name: Restart services
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 65002 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /home/zixify-app && docker compose up -d"

      - name: Verify backend health
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 65002 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sleep 10 && curl -sf http://localhost:3001/health && echo '✅ Backend healthy!'"

      - name: Deployment success
        if: success()
        run: echo "✅ Successfully deployed to https://zixify.zixai.in"

      - name: Deployment failed
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /home/zixify-app && docker compose logs --tail=50 backend" || true
          echo "❌ Deployment failed — check logs above"
